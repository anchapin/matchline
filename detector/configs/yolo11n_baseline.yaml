# YOLO11n, 2-class head — the control arm for the #500 ECA experiment.
#
# Identical to ultralytics/cfg/models/11/yolo11.yaml except `nc: 2` (door,
# window per detector/classes.py) and the n-scale row. The backbone and head are
# otherwise byte-identical to stock yolo11n, so this is the exact architecture
# that `YOLO('yolo11n.pt')` collapses to once fine-tuned for our taxonomy.
#
# Purpose: yolo11n_eca.yaml also sets nc: 2, so both arms of the A/B must be
# compared at nc: 2. Comparing the ECA build against stock yolo11n.yaml (nc: 80)
# would confound the ECA block against the Detect-head width and understate the
# ECA cost by tens of thousands of parameters.
#
# Run the A/B with identical seed/split/epochs:
#   # control
#   python train.py --model configs/yolo11n_baseline.yaml --pretrained yolo11n.pt \
#       --data configs/cubicasa.yaml --epochs E --seed S --name base
#   # treatment
#   python train.py --model configs/yolo11n_eca.yaml --pretrained yolo11n.pt \
#       --data configs/cubicasa.yaml --epochs E --seed S --name eca

nc: 2 # door, window (detector/classes.py unified taxonomy)
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # yolo11n

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5)
