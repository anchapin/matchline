# CubiCasa5K door/window detection dataset (generated by convert_cubicasa.py)
#
# `path` follows the repo-wide dataset convention (QUICKSTART.md): datasets live
# under ~/workspace/datasets/ and are never committed. It may also be written as
# a bare `~`-relative path or overridden per-machine with the
# MATCHLINE_DATASETS env var. train.py resolves all three forms; keep machine
# paths out of this file (see AGENTS.md never-list).
path: ~/workspace/datasets/detector_yolo/cubicasa
train: images/train
val: images/val
test: images/test

names:
  0: door
  1: window
