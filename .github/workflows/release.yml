name: release

# Publishing is tag-driven: pushing a vX.Y.Z tag whose name matches
# pyproject.toml builds the sdist and wheel, smoke-tests the wheel with a
# fresh install, and publishes to PyPI via trusted publishing (OIDC; no
# token secret stored in the repo). One-time maintainer setup on pypi.org:
# add a pending publisher / trusted publisher for anchapin/matchline,
# workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  # workflow_dispatch dry-runs the build+smoke path on a branch: the tag
  # check is skipped (GITHUB_REF_NAME is a branch, not a tag) and the
  # publish step skips because the current version is already on PyPI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          uv-version: "0.13.2"
          python-version: "3.12"

      - name: Tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          expected = "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              sys.exit(f"tag {tag} does not match pyproject version {expected}")
          PY

      - name: Build
        run: |
          uv build --sdist --wheel
          uv run --no-default-groups --group release twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Fresh install from the wheel, as a user would
        run: |
          python -m venv "$RUNNER_TEMP/relvenv"
          "$RUNNER_TEMP/relvenv/bin/pip" install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/relvenv/bin/pip" check
          "$RUNNER_TEMP/relvenv/bin/matchline" --help
          "$RUNNER_TEMP/relvenv/bin/matchline" run --help

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, smoke]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          uv-version: "0.13.2"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Skip if the version is already on PyPI
        id: skipcheck
        # PyPI never accepts the same version twice, so re-pointing a tag
        # (releases are tagged on main; a tag moved after a first publish)
        # would otherwise fail the run after build+smoke.
        run: |
          python - <<'PY'
          import glob, json, os, re, sys, urllib.request
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel in dist/"
          version = wheels[0].split("/")[-1].split("-")[1]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/matchline/json") as r:
                  published = json.load(r)["info"]["version"]
          except Exception as e:
              print(f"could not read PyPI state ({e}); publishing")
              published = None
          if published == version:
              print(f"{version} is already on PyPI; skipping publish")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
          else:
              print(f"{version} not on PyPI; publishing")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=false\n")
          sys.exit(0)
          PY

      - name: Publish
        # trusted publishing (OIDC) via uv; --check-url lets uv skip files
        # that already exist on PyPI instead of failing the run on them.
        # Tag pushes only: a workflow_dispatch dry-run must never publish.
        if: github.event_name == 'push' && steps.skipcheck.outputs.skip != 'true'
        run: |
          uv publish --trusted-publishing automatic --check-url https://pypi.org/p/

  github-release:
    name: create the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish]
    # Tag pushes only: a workflow_dispatch dry-run has no tag to release.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Create the release on the tag
        # Idempotent: a tag whose release already exists (a manual backfill
        # like the ones for v0.1.0-v0.2.1) must not fail the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release for $GITHUB_REF_NAME already exists; nothing to do"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
