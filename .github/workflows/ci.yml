name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: ruff + format + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[test]" ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Check test count
        run: |
          # Record the test count; a drift of ±1 or more requires investigation before merging.
          # Expected: ~441 tests. Update EXPECTED_TEST_COUNT if test count changes legitimately.
          EXPECTED_TEST_COUNT=441
          ACTUAL_TEST_COUNT=$(python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | awk '{print $1}')
          echo "Expected: $EXPECTED_TEST_COUNT, Actual: $ACTUAL_TEST_COUNT"
          if [ "$ACTUAL_TEST_COUNT" != "$EXPECTED_TEST_COUNT" ]; then
            echo "ERROR: Test count changed from $EXPECTED_TEST_COUNT to $ACTUAL_TEST_COUNT"
            echo "If this is intentional (e.g., removed obsolete tests), update EXPECTED_TEST_COUNT."
            echo "Otherwise, investigate why tests were added or removed."
            exit 1
          fi
