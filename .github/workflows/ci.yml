name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  no-empty-commits:
    name: detect empty commits
    runs-on: ubuntu-latest
    outputs:
      is_empty: ${{ steps.check.outputs.is_empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect empty commits
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            HEAD_REF="${{ github.head_ref }}"
            echo "Checking PR: head=$HEAD_REF base=$BASE_REF"
            # Fetch base from origin
            git fetch origin "$BASE_REF:$BASE_REF" 2>/dev/null || true
            # For fork PRs, fetch head from the fork's repo via github.event.pull_request.head.repo.full_name
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "Fork PR detected - fetching head from ${{ github.event.pull_request.head.repo.full_name }}"
              git fetch "${{ github.event.pull_request.head.repo.full_name }}" "$HEAD_REF:refs/heads/$HEAD_REF" 2>/dev/null || true
            else
              git fetch origin "$HEAD_REF:refs/heads/$HEAD_REF" 2>/dev/null || true
            fi
            HEAD_LOCAL_REF="refs/heads/$HEAD_REF"
            COMPARE_REF="$BASE_REF"
          else
            # For push events, compare against github.event.before
            echo "Checking push to ${{ github.ref }}"
            BEFORE_SHA="${{ github.event.before }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              echo "First push on branch - cannot detect empty commit (no previous sha)"
              echo "is_empty=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            COMPARE_REF="$BEFORE_SHA"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            # A release merge (develop -> main) brings develop's whole
            # history, where historical empty commits may legitimately exist
            # (db706a1, bb302a7). The gate for a release merge is that it
            # changes the tree.
            if [ -z "$(git diff --name-only "$BASE_REF...$HEAD_LOCAL_REF")" ]; then
              echo "Release merge changes no files"
              echo "is_empty=true" >> $GITHUB_OUTPUT
              exit 1
            fi
            echo "No empty release merge detected"
            echo "is_empty=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Loop per-commit to catch empty commits bundled with real ones
            EMPTY_COMMITS=""
            for SHA in $(git log --no-merges --format=%H "$COMPARE_REF..$HEAD_LOCAL_REF"); do
              if [ -z "$(git diff-tree --no-commit-id --name-only -r "$SHA")" ]; then
                echo "Empty commit detected: $(git log -1 --format='%h %s' "$SHA")"
                EMPTY_COMMITS="$EMPTY_COMMITS $(git log -1 --format='%h %s' "$SHA")"
              fi
            done
            if [ -n "$EMPTY_COMMITS" ]; then
              echo "Empty commits found:$EMPTY_COMMITS"
              echo "is_empty=true" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "No empty commits detected"
              echo "is_empty=false" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Same rationale for the post-merge push to main.
            if [ -z "$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}")" ]; then
              echo "Push to main changes no files"
              echo "is_empty=true" >> $GITHUB_OUTPUT
              exit 1
            fi
            echo "No empty push to main detected"
            echo "is_empty=false" >> $GITHUB_OUTPUT
          else
            # Loop per-commit for push events
            EMPTY_COMMITS=""
            for SHA in $(git log --no-merges --format=%H "$COMPARE_REF..${{ github.ref }}"); do
              if [ -z "$(git diff-tree --no-commit-id --name-only -r "$SHA")" ]; then
                echo "Empty commit detected: $(git log -1 --format='%h %s' "$SHA")"
                EMPTY_COMMITS="$EMPTY_COMMITS $(git log -1 --format='%h %s' "$SHA")"
              fi
            done
            if [ -n "$EMPTY_COMMITS" ]; then
              echo "Empty commits found:$EMPTY_COMMITS"
              echo "is_empty=true" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "No empty commits detected"
              echo "is_empty=false" >> $GITHUB_OUTPUT
            fi
          fi

  # detector-lint: lint-only coverage for the detector track.
  #
  # IMPORTANT: This job runs ruff on detector/*.py. It does NOT run the
  # detector test suite (detector/tests/test_eca.py), which requires torch +
  # ultralytics and the detector venv. Changes to detector code are verified
  # for lint cleanliness but NOT for runtime correctness in CI. The detector
  # tests must be run locally with:
  #   detector/.venv-det/bin/python -m pytest detector/tests -q
  # See issue #507 for context.
  detector-lint:
    name: detector ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Run ruff check on detector/
        run: uvx ruff@0.17.1 check detector/

  pip-audit:
    # #1139: scan the resolved runtime dependency set for known CVEs.
    # Runtime-only by design: a noisy transitive finding in test-only
    # tooling must not block the suite. When a finding lands, add an
    # --ignore <id> pin here with the reason and the upgrade that clears it.
    name: dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Sync the locked runtime environment
        # audit group carries pip-audit so the scanner version is locked too;
        # --no-default-groups keeps dev tooling out of the audit scope (#1139)
        run: uv sync --frozen --no-default-groups --group audit

      - name: Run pip-audit (fail on known runtime vulnerabilities)
        # The project itself is installed editable only to pull in its
        # runtime dependencies; drop it before the scan so the audit
        # covers the runtime dependency set alone. In the window between
        # a version bump and its release the version is not on PyPI
        # yet, and an environment scan trips --strict on it
        # (--skip-editable still reports editable distributions as an
        # error, so uninstalling is the reliable exclusion).
        # #1214/#1165, 2026-10-20; advisory set rotated 2026-10-21 (#1229):
        # the PyPI advisory DB flapped between snapshots mid-day (runners saw
        # 11 then 13 pillow CVEs), so both sets are ignored: 24 CVEs, all
        # pillow 12.3.0, all fixed in 13.0.0, but gradio pins pillow>=8.0,
        # <13.0 so 13.0.0 is unreachable in every fork of the lock. Ignored
        # with reason until gradio lifts its cap (check on the next gradio
        # bump); certifi was bumped in uv.lock to 2026.10.19
        # (GHSA-6q48-6c7w-9gw2), not ignored.
        run: >-
          uv pip uninstall matchline && uv run --no-sync pip-audit --strict
          --ignore-vuln CVE-2026-112390
          --ignore-vuln CVE-2026-112391
          --ignore-vuln CVE-2026-112392
          --ignore-vuln CVE-2026-112393
          --ignore-vuln CVE-2026-112396
          --ignore-vuln CVE-2026-112399
          --ignore-vuln CVE-2026-112401
          --ignore-vuln CVE-2026-112405
          --ignore-vuln CVE-2026-112406
          --ignore-vuln CVE-2026-112891
          --ignore-vuln CVE-2026-112892
          --ignore-vuln CVE-2026-112894
          --ignore-vuln CVE-2026-112901
          --ignore-vuln CVE-2026-112895
          --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897
          --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112899
          --ignore-vuln CVE-2026-112402
          --ignore-vuln CVE-2026-112900
          --ignore-vuln CVE-2026-112893

  deptry:
    # #1190: the #1070 bug class - a shipped module imports a package that is
    # only a transitive/extras dependency, and the demo-smoke job stays green
    # because it never touches that import path. deptry fails the PR when an
    # imported package is not declared.
    name: dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Sync the locked dev environment
        run: uv sync --frozen --group dev

      - name: Declared dependencies must cover imported packages
        # config lives in [tool.deptry] in pyproject.toml
        run: uv run --no-sync deptry .

  review-page-browser:
    # #802: drive review.html in headless Chromium (keys, edit prompt, layer
    # toggle, sheet highlight, export -> matchline review --apply).
    name: review page in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Sync the locked dev environment and install Playwright Chromium
        # playwright is a CI-only dep: installed into the synced venv (not
        # locked), matching the pip behavior this job had before
        run: |
          uv sync --frozen --extra test --extra openstudio
          uv pip install "playwright>=1.48,<2"
          uv run --no-sync python -m playwright install --with-deps chromium

      - name: Run browser test
        env:
          MATCHLINE_BROWSER_TESTS: "1"  # a missing browser fails instead of skipping
        run: uv run --no-sync python -m pytest tests/test_review_page_browser.py -q -rs

  quality:
    name: ruff + format + pytest
    runs-on: ubuntu-latest
    # #1137: coverage tracing slows pytest; headroom raised 20 -> 30.
    timeout-minutes: 30
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Sync the locked dev environment
        run: uv sync --frozen --extra test --extra openstudio

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run mypy (scoped baseline, #1138)
        run: uv run --no-sync python -m mypy

      - name: Check licenses (ledger, committed artifacts, built wheel)
        # #751: nothing trained on non-commercial or copyleft data may ship
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv run --no-sync python scripts/check_release_licenses.py "$RUNNER_TEMP"/dist/*.whl

      - name: Run pytest
        # pytest-xdist spreads the suite across the runner's cores; pytest was
        # ~88% of this merge-gating job when it ran on one core.
        # #1137: coverage measures the shipped surface (pyproject
        # [tool.coverage]); #1191 turns it into a gate via fail_under.
        run: uv run --no-sync python -m pytest tests/ -q -n auto --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (ratchet at 85.0, baseline 85.6, #1191)"
            uv run --no-sync python -m coverage report --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        # #1191: the report is built for every run but was never kept;
        # upload it so per-run coverage is inspectable from the run page.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Check test count
        run: |
          EXPECTED_TEST_COUNT=3841  # +17 mechanical schedule value-slot tests (#1236)  # +8 BuildingSync 2.x writer tests (#1238)  # +15 unified equipment model tests (#1237)  # +2 declared-length-over-body-bbox wall tests (#1227)  # +3 curve-set footprint placement-chain tests (#1229)  # +3 pset-exterior lining guard + unclassified-envelope tests (#1226)  # +2 geometry-first window-area truth tests (#1220)  # +3 wall-axis/Qto length-fallback tests (#1219)  # +2 pset-exterior Tier 1 envelope tests (#1219)  # +2 mm-unit kernel-verts file-units tests (#1217)  # +1 bodyless-wall direct-fill regression test (#1214)  # +4 direct-fill window/door enumeration tests (#1206) # +2 wall-length body-geometry fallback tests (#1205) # +3 rect-profile / face-set space footprint tests (#1204) # +2 closet area-cap tests (#1209) # +6 mapped-item/CSG body unwrap tests (#1203) # +7 independent benchmark truth tests (#1165) # +1 repo-map bem-package scan test (#1179) # +1 API reference doc sync test (#1167) # +2 canonical-model and telemetry goldens + 3 model reader-policy tests (#1164) # +3 font-fallback tests (#1163) # +5 perf-budget benchmark mechanics tests (#1162) # +16 IFC robustness corpus tests (#1161) # +3 convention report emission + schema pin tests (#1166) # +1 wall-class ckpt load in detection provider (#1152) # +8 wall-class head tests (#1113)  # +2 train-state resume tests (#1116)  # +29 point-in-polygon contract pins (#1129)  # +40 direct unit tests for opening_identity/opening_attach/construction_library_prm_data (#1128)  # +4 golden artifact tests (#1127)  # +4 telemetry/feedback round-trip tests (#1126)  # +7 tile-boundary straddle dedup tests (#1125)  # +10 degenerate-input battery tests (#1124)  # +14 help coverage for the remaining subcommands + 9 CLI contract dispatch tests (#1123)  # +5 cleanup-sweep tests  # +8 AP50 metric tests (#1119)  # +7 schedule KR/EM/VF1 + noise tests (#1114)  # +8 schedule-score tests (#1112)  # +6 repo-map generator tests (#1096)  # +2 feedback-summary tests (#1080)  # +1 review-page provenance-method test (#1079)  # +4 run --baseline tests (#1077)  # +2 moved-pairs detail tests (#1078)  # +3 shared-html-page tests (#1044) # +6 moved-opening pairing tests (#1045) # +7 space-fingerprint reidentification tests (#1046) # +7 legend tag suggestion tests (#1047) # +7 takeoff-diff review-item tests (#1048)  # +1 takeoff-diff legacy legend-key fallback test (#1034)  # +2 cloud chain false-positive guards (#993)  # +18 revision tracking + takeoff diff tests (#993)  # +12 review queue filters, bulk and worst-first tests (#996)  # +17 in-viewer corrections tests (#1002)  # +20 review-viewer scene/page/CLI tests (#1001)  # +13 telemetry-spec tests (#1003) + 5 progressive-mode tests (#998)  # +6 export-package zip / share-back / contents tests (#999)  # +12 match-line pairing / enlarged-plan dedup tests (#994)  # +16 correction-history tests (#997)  # +5 single-dimension scale tests + 1 walls_for_sheets review-item test + 1 real-set fallback end-to-end test + 1 multi-part edge-count test + 1 duplicate-dimension-text test (#1019)  # +13 mech_schedule tests (#974) +7 area-definitions registry/report/battery tests (#975)  # +1 duplicate-room dedupe test (#1008)  # +1 empty-units short-wall early-return test (#1010)  # +1 too-short-wall opening skip test (#1010)  # +1 trust-report sign-off block test (#976)  # +1 zip basename-collision test (duck review, #988)  # +4 matchline-ui input-mode tests (#988)  # +7 drawing-set zip tests (#988)  # +2 run_pipeline --ifc tests (#988)  # +10 matchline-ui app tests (#982)  # +1 checked-in specialist config test (#743)  # +1 tiled-checkpoint ledger test (#743)  # +5 specialist labels tests (#743)  # +4 multi-scale sheet tests (#743)  # +2 tiled NMS IoU tests (#743)  # +2 raw-detection dump tests (#743)  # +4 synth stroke-weight regime tests (#743)  # +5 tile-based eval + conversion tests (#743)  # +4 scratch provider tests (#743)  # +5 consistent-frame loss + box bias-init tests (#743)  # +2 converter package-import regression tests (#743)  # +7 ScratchLoss/decode/NMS device tests (#743)  # +2 benchmark door-recall column tests (#743)  # +6 IFC4 export of semi-exterior/vestibule walls (#747)  # +13 5.5.2 vestibule sentence tests (#747)  # +2 IFC2X3 upgrade regression tests (#929)  # +3 simplify_budget simplified-area + ring-offset re-verification tests (#971)  # +2 benchmark surface-count column tests (#972)  # +3 multi-storey per-space wall-split tests (#986)  # +21 legend tag learning tests (#995) # +5 public API surface pin tests (#1159) # +3 wall-clock budget verdict tests (#1160) # +2 --acknowledge-review tests (#1160)
          # Count tests using --collect-only (fast path)
          COLLECT_OUT=$(uv run --no-sync python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1)
          ACTUAL_TEST_COUNT=$(echo "$COLLECT_OUT" | awk '{print $1}')
          if [ -z "$ACTUAL_TEST_COUNT" ] || [ "$ACTUAL_TEST_COUNT" = "No" ]; then
            echo "WARNING: pytest --collect-only returned no useful output; skipping count check"
            echo "Run 'python -m pytest tests/ --collect-only -q' locally to verify test count."
          else
            echo "Expected: $EXPECTED_TEST_COUNT, Actual: $ACTUAL_TEST_COUNT"
            if [ "$ACTUAL_TEST_COUNT" != "$EXPECTED_TEST_COUNT" ]; then
              echo "ERROR: Test count changed from $EXPECTED_TEST_COUNT to $ACTUAL_TEST_COUNT"
              echo "If this is intentional (e.g., removed obsolete tests), update EXPECTED_TEST_COUNT."
              exit 1
            fi
          fi

  repo-map:
    # #1096: docs/repo-map.mmd is generated from the tree's imports; the map
    # must be regenerated whenever imports change.
    name: repo map up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate and diff
        run: |
          python scripts/generate_repo_map.py
          git diff --exit-code docs/repo-map.mmd docs/repo-map.md

  perf-budget:
    # #1162: the release perf gate. The benchmark (scripts/perf_budget.py)
    # measures import, validation and export wall-clock and peak RSS on the
    # synthetic reference large model and exits non-zero on a budget
    # violation; RELEASING.md step 2 requires this job green before tagging.
    name: performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -e .

      - name: Run perf-budget benchmark
        run: python scripts/perf_budget.py --ci --out perf_report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf_report.json

  wheel-smoke:
    # #1035: a non-editable install only works if py-modules lists every module
    name: wheel contains every module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: pip wheel --no-cache-dir --no-deps -w "$RUNNER_TEMP/dist" .

      - name: Every module is in the wheel
        # self-maintaining: any new top-level module must be packaged or this
        # fails, and the packages come from pyproject.toml rather than a
        # hardcoded list here, so a package that joins or leaves the wheel
        # cannot hide (#1076: review_classifier was missing while this passed)
        run: |
          python - "$RUNNER_TEMP"/dist/*.whl <<'PY'
          import glob, pathlib, sys, tomllib, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          packages = tomllib.load(open("pyproject.toml", "rb"))["tool"]["setuptools"]["packages"]
          missing = [f for f in glob.glob("*.py") if f not in names]
          pkg_missing = []
          for pkg in packages:
              pkg_missing += [
                  str(f)
                  for f in sorted(pathlib.Path(pkg).glob("*.py"))
                  if str(f) not in names
              ]
          if missing or pkg_missing:
              print("missing from wheel:", missing + pkg_missing)
              sys.exit(1)
          print("wheel ok:", sys.argv[1], f"({len(packages)} packages checked)")
          PY

  demo-smoke:
    # #753: fresh-clone install + matchline demo, the quickstart path
    name: fresh install + matchline demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package (non-editable, as a fresh user would)
        run: pip install --no-cache-dir .

      - name: Every CLI subcommand answers --help
        # #1076: `matchline review` died on import for real installs while
        # this job stayed green, because only `matchline demo` was exercised.
        # Subcommands are read from cli.py so a new one is covered on arrival.
        run: |
          python - <<'PY'
          import re, subprocess, sys
          src = open("cli.py").read()
          names = []
          for m in re.finditer(r"add_parser\(", src):
              tail = src[m.end():m.end() + 200]
              hit = re.search(r"['\"]([a-z0-9-]+)['\"]", tail)
              if hit:
                  names.append(hit.group(1))
          names = sorted(set(names))
          assert names, "no subcommands found in cli.py"
          bad = []
          for name in names:
              r = subprocess.run([sys.executable, "-m", "cli", name, "--help"], capture_output=True, text=True)
              if r.returncode != 0:
                  bad.append((name, (r.stderr or r.stdout).strip()[:200]))
          if bad:
              for name, err in bad:
                  print(f"{name}: {err}", file=sys.stderr)
              sys.exit(1)
          print(f"all {len(names)} subcommands answer --help")
          PY

      - name: Run matchline demo
        run: |
          start=$SECONDS
          matchline demo --no-open
          took=$(( SECONDS - start ))
          echo "demo took ${took}s"
          test -f matchline-demo/package/trust_report.html
          test -f matchline-demo/review/review.html
          test "$took" -lt 300


  python-matrix:
    # #1163: one job per supported Python. Installs the built wheel, imports
    # the shipped entry modules, and runs the demo end to end. The support
    # policy lives in docs/platform_support.md; adding a version means
    # bumping this list, the docs table, and the classifiers together.
    name: "wheel install: linux / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: python -m pip wheel --no-cache-dir --no-deps -w "$RUNNER_TEMP/dist" .

      - name: Install the wheel
        run: python -m pip install --no-cache-dir "$RUNNER_TEMP"/dist/matchline-*.whl

      - name: Import the installed wheel
        # from outside the checkout so site-packages, not the source tree,
        # is what answers; the demo below exercises the rest end to end
        working-directory: ${{ runner.temp }}
        run: python -c "import cli, sim, synth, validate, query, link"

      - name: Run matchline demo
        run: |
          start=$SECONDS
          matchline demo --no-open
          took=$(( SECONDS - start ))
          echo "demo took ${took}s"
          test -f matchline-demo/package/trust_report.html
          test -f matchline-demo/review/review.html
          test "$took" -lt 300

  platform-matrix:
    # #1163: macOS/Windows demo coverage. These runners bill at a premium,
    # so they run on every push to develop/main (including release commits),
    # on workflow_dispatch, and on PRs labeled `platform`, rather than on
    # every PR. Known platform gaps live in docs/platform_support.md.
    name: "wheel install: ${{ matrix.os-label }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [no-empty-commits]
    if: >-
      needs.no-empty-commits.outputs.is_empty != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'platform')))
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   os-label: macos,   python-version: "3.12" }
          - { os: windows-latest, os-label: windows, python-version: "3.12" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: python -m pip wheel --no-cache-dir --no-deps -w "$RUNNER_TEMP/dist" .

      - name: Install the wheel
        run: python -m pip install --no-cache-dir "$RUNNER_TEMP"/dist/matchline-*.whl

      - name: Import the installed wheel
        working-directory: ${{ runner.temp }}
        run: python -c "import cli, sim, synth, validate, query, link"

      - name: Run matchline demo
        run: |
          start=$SECONDS
          matchline demo --no-open
          took=$(( SECONDS - start ))
          echo "demo took ${took}s"
          test -f matchline-demo/package/trust_report.html
          test -f matchline-demo/review/review.html
          test "$took" -lt 300
