name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  no-empty-commits:
    name: detect empty commits
    runs-on: ubuntu-latest
    outputs:
      is_empty: ${{ steps.check.outputs.is_empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect empty commits
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            echo "Checking PR: head=${{ github.head_ref }} base=$BASE_REF"
            # Fetch base branch to ensure we have it
            git fetch origin "$BASE_REF:$BASE_REF" --depth=1 2>/dev/null || true
            COMPARE_REF="origin/$BASE_REF"
          else
            # For push events, compare against the tracked remote branch
            # or use the first parent for non-merge commits
            echo "Checking push to ${{ github.ref }}"
            if git rev-parse "${{ github.ref }}"^1 &>/dev/null; then
              COMPARE_REF="${{ github.ref }}^"
            else
              echo "First commit on branch - cannot detect empty commit (no parent)"
              echo "is_empty=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "Comparing: $COMPARE_REF..${{ github.ref }}"

          # Check if diff is empty (no file changes)
          if git diff --name-only "$COMPARE_REF" "${{ github.ref }}" | grep -q .; then
            echo "Changes detected - not an empty commit"
            echo "is_empty=false" >> $GITHUB_OUTPUT
          else
            echo "NO changes detected - empty commit!"
            echo "is_empty=true" >> $GITHUB_OUTPUT
            git log --oneline "$COMPARE_REF..${{ github.ref }}"
            exit 1
          fi

  quality:
    name: ruff + format + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [no-empty-commits]
    if: needs.no-empty-commits.outputs.is_empty != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install --no-cache-dir -e ".[test]" "ruff==0.16.8" && ruff --version

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Check test count
        run: |
          EXPECTED_TEST_COUNT=902  # +16 tests: +12 issue-423, +3 conservation checks, +1 #415 export-block regression
          # Count tests using --collect-only (fast path)
          COLLECT_OUT=$(python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1)
          ACTUAL_TEST_COUNT=$(echo "$COLLECT_OUT" | awk '{print $1}')
          if [ -z "$ACTUAL_TEST_COUNT" ] || [ "$ACTUAL_TEST_COUNT" = "No" ]; then
            echo "WARNING: pytest --collect-only returned no useful output; skipping count check"
            echo "Run 'python -m pytest tests/ --collect-only -q' locally to verify test count."
          else
            echo "Expected: $EXPECTED_TEST_COUNT, Actual: $ACTUAL_TEST_COUNT"
            if [ "$ACTUAL_TEST_COUNT" != "$EXPECTED_TEST_COUNT" ]; then
              echo "ERROR: Test count changed from $EXPECTED_TEST_COUNT to $ACTUAL_TEST_COUNT"
              echo "If this is intentional (e.g., removed obsolete tests), update EXPECTED_TEST_COUNT."
              exit 1
            fi
          fi
