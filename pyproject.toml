[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchline"
version = "0.1.0"
description = "Deterministic, auditable extraction of building energy modeling (BEM) inputs from architectural drawings and BIM"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Alex Chapin" }]
keywords = ["bem", "bim", "ifc", "gbxml", "floor-plan", "energy-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "shapely",
    "Pillow",
    "scipy",
    "lxml>=4.9.0",
    "ifcopenshell>=0.9",
    "jsonschema",
    # PDF drawing-set ingestion (#737); Apache-2.0/BSD-3 (PyMuPDF avoided: AGPL)
    "pypdfium2>=4.30",
    # trust report PDF (#750); BSD, pure Python, no system libraries
    "reportlab>=4.0",
]

[project.optional-dependencies]
# OCR for room labels (lazy import; helpful error if missing)
ocr = ["rapidocr_onnxruntime"]
# Optional second OCR backend for schedule tags (#668); needs the tesseract binary
ocr-tesseract = ["pytesseract"]
# COBie workbook reader for mechanical schedules (#974); lazy import
mech = ["openpyxl"]
# opencv-python-headless: same cv2 API, no libGL system dependency (#535)
test = ["pytest", "pytest-xdist", "hypothesis", "opencv-python-headless", "scikit-learn", "pyyaml", "pyarrow", "openpyxl"]
# FloorPlanCAD parquet loader (#683)
datasets = ["pyarrow"]
# Detector track: heavy. detector/ keeps its own venv on dev machines
# (see detector/README.md); this extra is for real hardware / CI images.
detector = ["torch", "ultralytics"]
# OpenStudio round-trip gate (#628): CI installs it; tests skip without it
openstudio = ["openstudio"]
# One-page web app (#982): matchline-ui launches on 127.0.0.1:7860
ui = ["gradio>=4.0"]

[project.scripts]
matchline = "cli:main"
matchline-ui = "ui.app:main"

[tool.setuptools]
py-modules = [
    "area_definitions",
    "air_loops",
    "atria",
    "below_grade",
    "bem_export",
    "bem_geometry",
    "bem_helpers",
    "bem_ifc4",
    "bem_layers",
    "bem_levels",
    "bem_loads",
    "bem_multistorey",
    "bem_roof",
    "bem_shading",
    "bem_space_split",
    "building_model",
    "cli",
    "construction_library",
    "construction_library_data",
    "construction_library_prm_data",
    "constructions",
    "convention_report",
    "mech_schedule",
    "datasets_adapter",
    "daylight_skylights",
    "detection_provider",
    "diff",
    "door_detect",
    "drawing_scale",
    "elevation_sheets",
    "elevation_windows",
    "export_package",
    "facade_takeoff",
    "geometry_simplify",
    "grade",
    "grid_detect",
    "hvac_legend",
    "hvac_trace",
    "ifc_export",
    "ifc_import",
    "ifc_roof_planes",
    "ifc_space_borders",
    "ifc_wall_joins",
    "ifc_wall_linings",
    "ifc_wall_loops",
    "ifc_wall_split",
    "interstory",
    "jesse",
    "lighting",
    "limits",
    "link",
    "materials",
    "mech_tags",
    "opening_attach",
    "opening_identity",
    "pdf_ingest",
    "pdf_schedules",
    "pipeline_exceptions",
    "plan_walls",
    "polygon_classify",
    "real_set",
    "registration",
    "review_report",
    "roof_geometry",
    "room_labels",
    "run_bem_export",
    "run_elevation_windows",
    "run_facade_takeoff",
    "run_mnist",
    "run_multidiscipline",
    "run_pipeline",
    "run_room_labels",
    "run_symbols",
    "run_validation",
    "safe_xml",
    "schedule_parse",
    "semi_exterior",
    "sheet_index",
    "solar_aperture",
    "space_conditioning",
    "space_merge",
    "space_use_defaults",
    "space_use_defaults_data",
    "symbols",
    "thermal_zoning",
    "validate",
    "wall_types",
    "zone_airflow",
    "zone_capacity",
]
packages = [
    "link",
    "query",
    "sim",
    "synth",
    "ui",
    "validate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100  # enforced (E501); geometry/XML literals opt out inline with `# noqa: E501`
target-version = "py310"
# detector/ is a separate track with its own venv (see detector/README.md)
exclude = ["detector"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "FA"]
ignore = [
    "E701", # pre-existing style: `if x: return y` one-liners used throughout
    "E702", # pre-existing style: semicolon one-liners used throughout
    "E741", # pre-existing style: `l` as a loop variable in comprehensions
    "F821", # forward-reference-only Provenance annotation: no runtime import needed
]

[tool.ruff.lint.per-file-ignores]
# XXE fixtures embed a verbatim one-line gbXML root element inside a string.
"tests/test_validate_gbxml_xxe.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["synth"]
