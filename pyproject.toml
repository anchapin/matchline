[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchline"
version = "0.2.1"
description = "Deterministic, auditable extraction of building energy modeling (BEM) inputs from architectural drawings and BIM"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Alex Chapin" }]
keywords = ["bem", "bim", "ifc", "gbxml", "floor-plan", "energy-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "shapely",
    "Pillow",
    "scipy",
    "lxml>=4.9.0",
    "ifcopenshell>=0.9",
    "jsonschema",
    # PDF drawing-set ingestion (#737); Apache-2.0/BSD-3 (PyMuPDF avoided: AGPL)
    "pypdfium2>=4.30",
    # trust report PDF (#750); BSD, pure Python, no system libraries
    "reportlab>=4.0",
    # review-queue auto-triage (#1070): TypedDecider loads its .npz models
    # through sklearn estimators, and run_review imports the classifier at
    # module top, so a real install needs it or `matchline review` dies
    "scikit-learn",
    # stdlib tomllib landed in Python 3.11; the 3.10 support line needs the
    # backport (#1163, found by the python-matrix install job)
    "tomli>=2.0; python_version < '3.11'",
]

# PyPI metadata links (#1193).
[project.urls]
Homepage = "https://github.com/anchapin/matchline"
Repository = "https://github.com/anchapin/matchline"
Issues = "https://github.com/anchapin/matchline/issues"
Changelog = "https://github.com/anchapin/matchline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# OCR for room labels (lazy import; helpful error if missing)
ocr = ["rapidocr_onnxruntime"]
# Optional second OCR backend for schedule tags (#668); needs the tesseract binary
ocr-tesseract = ["pytesseract"]
# COBie workbook reader for mechanical schedules (#974); lazy import
mech = ["openpyxl"]
# opencv-python-headless: same cv2 API, no libGL system dependency (#535)
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "opencv-python-headless",
    "scikit-learn",
    "pyyaml",
    "pyarrow",
    "openpyxl",
    "pytest-randomly>=5.0.0",
]
# FloorPlanCAD parquet loader (#683)
datasets = ["pyarrow"]
# Detector track: heavy. detector/ keeps its own venv on dev machines
# (see detector/README.md); this extra is for real hardware / CI images.
detector = ["torch", "ultralytics"]
# OpenStudio round-trip gate (#628): CI installs it; tests skip without it
openstudio = ["openstudio"]
# One-page web app (#982): matchline-ui launches on 127.0.0.1:7860
ui = ["gradio>=4.0"]

[dependency-groups]
# CI tool pins live here so the lockfile pins them and workflow files stop
# carrying inline version pins; Renovate bumps these with the pre-commit pin.
dev = [
    "ruff==0.17.2",
    "mypy==2.4.0",
    "deptry==0.23.1",
    "matplotlib",
    "pdfplumber",
]
# pip-audit stays runtime-only in scope (#1139): the pip-audit job syncs
# just this group and the project itself, then audits the resolved set.
audit = [
    "pip-audit",
]
# release.yml metadata check (#1189 phase 2): twine check stays as the
# sdist/wheel metadata gate, now locked instead of pip-installed per run.
release = [
    "twine",
]

[tool.deptry]
# Single-file helper modules outside the shipped package (detector/ and
# scripts/ tooling) import each other directly; they are first-party by
# definition and must not require a PyPI declaration (#1190).
known_first_party = [
    "matchline",
    "ap50", "classes", "degrade", "degrade_scans", "eca", "pdf_fixtures",
    "report_ab_stats", "sahi_infer", "train_scratch",
]

# cv2 and yaml resolve to their distribution names statically; without this
# map deptry falls back to the local environment, so a dev-only sync (the CI
# job) reports them as missing while a full venv hides the problem.
[tool.deptry.package_module_name_map]
"opencv-python-headless" = "cv2"
pyyaml = "yaml"

[tool.deptry.per_rule_ignores]
DEP001 = [
    # datasets_adapter._rasterize_pdf lazily imports pymupdf only on the
    # AEC-bench rasterization path; the package is heavy and undeclared by
    # design. Declaring it (runtime dep or extra) is a maintainer call and
    # the follow-up recorded on #1190.
    "pymupdf",
]
DEP002 = [
    # pytest plugins: imported by pytest itself, never by project code.
    "pytest-cov", "pytest-xdist", "hypothesis", "pytest-randomly",
    # the openstudio extra exists to ship the OpenStudio CLI the sim jobs
    # invoke; its Python module is never imported.
    "openstudio",
]
DEP004 = [
    # detector/, scripts/ and review_classifier/ tooling runs inside the dev
    # environment by design, so dev-group imports there are intentional.
    "matplotlib", "pdfplumber",
]

[project.scripts]
matchline = "cli:main"
matchline-ui = "ui.app:main"

[tool.setuptools]
py-modules = [
    "area_definitions",
    "air_loops",
    "building_model",
    "equipment",
    "cli",
    "construction_library",
    "construction_library_data",
    "atomic_io",
    "html_page",
    "construction_library_prm_data",
    "constructions",
    "legend_learning",
    "mech_schedule",
    "datasets_adapter",
    "daylight_skylights",
    "detection_provider",
    "diff",
    "door_detect",
    "elevation_windows",
    "export_package",
    "facade_takeoff",
    "grid_detect",
    "hvac_legend",
    "hvac_trace",
    "jesse",
    "lighting",
    "limits",
    "materials",
    "matchlines",
    "mech_tags",
    "opening_attach",
    "opening_identity",
    "pipeline_exceptions",
    "plan_walls",
    "real_set",
    "registration",
    "room_labels",
    "run_bem_export",
    "run_elevation_windows",
    "run_facade_takeoff",
    "run_mnist",
    "run_multidiscipline",
    "run_pipeline",
    "run_room_labels",
    "run_review",
    "run_symbols",
    "run_validation",
    "sim_smoke",
    "safe_xml",
    "schedule_parse",
    "solar_aperture",
    "space_conditioning",
    "space_merge",
    "space_use_defaults",
    "space_use_defaults_data",
    "symbols",
    "takeoff_diff",
    "telemetry_emitter",
    "telemetry_spec",
    "thermal_zoning",
    "wall_types",
    "zone_airflow",
    "zone_capacity",
]
packages = [
    "assets",
    "ingest",
    "geometry",
    "review",
    "ifc",
    "bem",
    "link",
    "query",
    "sim",
    "synth",
    "ui",
    "validate",
    "review_classifier",
]

[tool.coverage.run]
# #1137: measure the shipped surface (the root py-modules plus the
# packages the wheel ships; #1179 moves module groups into packages). detector/ has its own lint-only gate and is
# not shipped from this wheel; tests, scripts and docs are not package code.
source = ["."]
omit = [
  "tests/*",
  "detector/*",
  "scripts/*",
  "docs/*",
  "build/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
# #1191: the ratchet is on. Baseline 85.6% measured by CI on develop
# b3e204d (2026-10-19); fail_under sits slightly below it (per the
# #1137 note) so a run-to-run wobble does not red CI, and raising it
# from here is a deliberate, reviewed edit - never let a new commit
# lower the floor.
fail_under = 85.0
precision = 1
show_missing = false

[tool.mypy]
# #1138: baseline type checking, deliberately scoped small. The module list
# grows only intentionally, module by module, as code is annotated; the rest
# of the tree stays out until then. follow_imports = "silent" means imported
# repo modules are resolved but not checked, so widening the list is a
# choice, never an accident.
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
files = [
  "opening_identity.py",
  "opening_attach.py",
  "construction_library_prm_data.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# #1192: the suites have always split by convention (the browser test runs
# as its own CI step, the smoke workflows run their own files, the
# OpenStudio extra importor-skips). Registering the markers makes the split
# declarative and lets a local run deselect, e.g. -m "not openstudio".
markers = [
  "browser: drives a real browser (Playwright); runs as its own CI step, outside the default suite",
  "openstudio: requires the OpenStudio extra; CI installs it, the module importor-skips without it",
  "slow: long-running; excluded by the caller explicitly, never silently",
]

[tool.ruff]
line-length = 100  # enforced (E501); geometry/XML literals opt out inline with `# noqa: E501`
target-version = "py310"
# detector/ is a separate track with its own venv (see detector/README.md)
exclude = ["detector"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "FA"]
ignore = [
    "E701", # pre-existing style: `if x: return y` one-liners used throughout
    "E702", # pre-existing style: semicolon one-liners used throughout
    "E741", # pre-existing style: `l` as a loop variable in comprehensions
    "F821", # forward-reference-only Provenance annotation: no runtime import needed
]

[tool.ruff.lint.per-file-ignores]
# XXE fixtures embed a verbatim one-line gbXML root element inside a string.
"tests/test_validate_gbxml_xxe.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["synth"]

[tool.setuptools.package-data]
# Runtime data the wheel must carry (#1070, #1071): the license ledger gates
# detector artifacts, the schemas validate gbXML exports and detector loads,
# and review_classifier needs its trained models for auto-triage.
"assets" = ["*.json", "schemas/*.json", "schemas/*.xsd"]
"review_classifier" = ["*.npz"]
